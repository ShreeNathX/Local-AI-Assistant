# =============================================================
# SLM Project — Training Configuration
# configs/training.yaml
#
# Default training settings for the 50M model on GTX 1650.
# Adjust based on hardware_check.py results.
# =============================================================

training:
  # --- Core ---
  model_config: "configs/model_50m.yaml"  # which model to train
  dataset_version: "v001"
  tokenizer_version: "v001"

  # --- Batch & Accumulation ---
  batch_size: 4            # per-GPU micro-batch (fits in 4 GB VRAM with fp16)
  gradient_accumulation_steps: 8   # effective batch = 4 * 8 = 32
  # NOTE: Increase grad_accum if OOM; decrease batch_size if still OOM.

  # --- Steps ---
  max_steps: 100000        # total optimizer steps
  warmup_steps: 1000       # linear warmup
  eval_interval: 500       # steps between validation evaluations
  save_interval: 1000      # steps between checkpoint saves
  log_interval: 10         # steps between loss logs

  # --- Optimizer ---
  optimizer: "adamw"
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0           # gradient norm clipping

  # --- Scheduler ---
  scheduler: "cosine"      # cosine decay after warmup
  min_lr_ratio: 0.1        # min_lr = learning_rate * min_lr_ratio

  # --- Mixed Precision ---
  mixed_precision: "bf16"  # bf16 | fp16 | fp32
  # NOTE: GTX 1650 does NOT support bf16 natively — use fp16 instead.
  # This will be auto-corrected by the trainer based on GPU capability.

  # --- Reproducibility ---
  seed: 42

  # --- Checkpointing ---
  checkpoint_dir: "checkpoints"
  keep_last_n_checkpoints: 3
  keep_best_checkpoint: true    # always keep best val loss checkpoint
  resume_from: null             # path to checkpoint to resume from; null = start fresh

  # --- Data ---
  data_dir: "data/processed"
  num_workers: 0           # 0 is safer on Windows; increase if IO is bottleneck
  pin_memory: true

  # --- Validation ---
  val_split: 0.005         # fraction of data held for validation
