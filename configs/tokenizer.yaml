# =============================================================
# SLM Project — Tokenizer Configuration
# configs/tokenizer.yaml
# =============================================================

tokenizer:
  version: "v001"
  algorithm: "bpe"         # bpe | wordpiece | unigram
  vocab_size: 32000

  # --- Special Tokens ---
  special_tokens:
    unk_token: "[UNK]"
    bos_token: "[BOS]"     # beginning of sequence
    eos_token: "[EOS]"     # end of sequence
    pad_token: "[PAD]"
    sep_token: "[SEP]"
    mask_token: "[MASK]"   # reserved for future MLM experiments

  # --- Training Data ---
  # Paths relative to project root.
  # The tokenizer trainer will sample from these files.
  training_files:
    - "data/processed/tokenizer_train.txt"

  # --- Parameters ---
  min_frequency: 2         # discard tokens occurring < N times
  max_token_length: 15     # discard tokens longer than N chars

  # --- Output ---
  output_dir: "tokenizer/artifacts/v001"
