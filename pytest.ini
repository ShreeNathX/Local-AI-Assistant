[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -v
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may require files/network)
    smoke: Quick smoke tests
    regression: Regression tests (run on every model change)
    slow: Slow tests (GPU training, large data) - skip with -m "not slow"
